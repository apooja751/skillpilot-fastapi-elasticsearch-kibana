
input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if ![timestamp] {
    mutate {
      add_field => {
        "timestamp" => "%{@timestamp}"
      }
    }
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://172.18.0.1:9200"]
    index => "skillpilot-fastapi-logs"
  }

  stdout {
    codec => rubydebug
  }
}
